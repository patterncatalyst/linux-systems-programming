<text x="282.5" y="94.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">parked — no M</text>
<text x="282.5" y="94.0" font-size="11" fill="#555" text-anchor="middle">parked — no M</text>
<path d="M560,100 L648,100" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="610.0" y="94.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">epoll event wakes G</text>
<text x="610.0" y="94.0" font-size="11" fill="#b8650a" text-anchor="middle">epoll event wakes G</text>
<path d="M235,330 L318,330" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="282.5" y="324.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">kernel blocks the M</text>
<text x="282.5" y="324.0" font-size="11" fill="#555" text-anchor="middle">kernel blocks the M</text>
<path d="M560,330 L648,330" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="610.0" y="324.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">handoffp → startm/newm</text>
<text x="610.0" y="324.0" font-size="11" fill="#b8650a" text-anchor="middle">handoffp → startm/newm</text>
<text x="480" y="480" font-size="12" fill="#111111" text-anchor="middle" font-weight="700">goroutines != threads: 2000 parked goroutines, 12 OS threads, bound 80 — a raw blocking read would need ~2000 threads</text>
</svg>