<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="920" height="200" rx="12" fill="#eef4fb" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">netpoll theme (this chapter) — goroutines parked on the netpoller, no M held</text>
<rect x="20" y="250" width="920" height="200" rx="12" fill="#f4f4f4" stroke="#ddd"/>
<text x="32" y="270" font-size="12" font-weight="700" fill="#1d1d1d">contrast — a raw blocking syscall.Read pins its own M per goroutine</text>
<rect x="45" y="60" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="90.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">2000 goroutines</text>
<text x="140.0" y="107.5" font-size="11.5" fill="#555555" text-anchor="middle">blocked on os.Pipe read</text>
<text x="140.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">EAGAIN → gopark, no M</text>
<rect x="320" y="60" width="240" height="80" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="440.0" y="90.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">netpoller — 1 shared epoll</text>
<text x="440.0" y="107.5" font-size="11.5" fill="#555555" text-anchor="middle">EpollWait issues epoll_pwait(2)</text>
<text x="440.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">edge-triggered, per-fd pollDesc</text>
<rect x="650" y="60" width="230" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="765.0" y="90.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OS threads (M)</text>
<text x="765.0" y="107.5" font-size="11.5" fill="#555555" text-anchor="middle">threads = 12</text>
<text x="765.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">bound = 4·GOMAXPROCS+16 = 80</text>
<rect x="45" y="290" width="190" height="80" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="140.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">N goroutines</text>
<text x="140.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">syscall.Read on a raw fd</text>
<text x="140.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">never epoll-registered</text>
<rect x="320" y="290" width="240" height="80" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="440.0" y="320.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">one M blocks in read(2)</text>
<text x="440.0" y="337.5" font-size="11.5" fill="#dddddd" text-anchor="middle">per concurrently-blocked G</text>
<text x="440.0" y="352.5" font-size="11.5" fill="#dddddd" text-anchor="middle">entersyscall keeps the P briefly</text>
<rect x="650" y="290" width="230" height="80" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="765.0" y="320.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">OS thread count climbs</text>
<text x="765.0" y="337.5" font-size="11.5" fill="#555555" text-anchor="middle">toward N (clone() storm)</text>
<text x="765.0" y="352.5" font-size="11.5" fill="#555555" text-anchor="middle">sysmon retake / startm / newm</text>
