<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1112" height="200" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">A thread — ch50 measured this</text>
<rect x="24" y="272" width="1112" height="232" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="292" font-size="12" font-weight="700" fill="#1d1d1d">A coroutine frame — measured here, via operator new in the promise</text>
<rect x="400" y="14" width="360" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">one paused computation, two prices</text>
<rect x="56" y="96" width="300" height="134" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="206.0" y="138.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">std::thread / pthread</text>
<text x="206.0" y="155.5" font-size="11.5" fill="#555555" text-anchor="middle">8388608 bytes of stack</text>
<text x="206.0" y="170.5" font-size="11.5" fill="#555555" text-anchor="middle">mmap&#x27;d up front, per thread</text>
<text x="206.0" y="185.5" font-size="11.5" fill="#555555" text-anchor="middle">plus a kernel task_struct</text>
<text x="206.0" y="200.5" font-size="11.5" fill="#555555" text-anchor="middle">and a tid in /proc</text>
<rect x="396" y="96" width="330" height="134" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="561.0" y="138.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the stack is VIRTUAL —</text>
<text x="561.0" y="155.5" font-size="11.5" fill="#555555" text-anchor="middle">untouched pages are never backed,</text>
<text x="561.0" y="170.5" font-size="11.5" fill="#555555" text-anchor="middle">so it usually works. It still</text>
<text x="561.0" y="185.5" font-size="11.5" fill="#555555" text-anchor="middle">collides with overcommit limits,</text>
<text x="561.0" y="200.5" font-size="11.5" fill="#555555" text-anchor="middle">cgroup accounting, and 32-bit spaces.</text>
<rect x="766" y="96" width="340" height="134" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="936.0" y="146.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">can be interrupted anywhere</text>
<text x="936.0" y="163.0" font-size="11.5" fill="#555555" text-anchor="middle">preemptive: the scheduler</text>
<text x="936.0" y="178.0" font-size="11.5" fill="#555555" text-anchor="middle">moves it whether or not</text>
<text x="936.0" y="193.0" font-size="11.5" fill="#555555" text-anchor="middle">the code cooperates</text>
<rect x="56" y="314" width="300" height="134" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="206.0" y="356.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">one coroutine frame</text>
<text x="206.0" y="373.5" font-size="11.5" fill="#555555" text-anchor="middle">trivial:  32 bytes</text>
<text x="206.0" y="388.5" font-size="11.5" fill="#555555" text-anchor="middle">+ 4 ints, char[256]:  304</text>
<text x="206.0" y="403.5" font-size="11.5" fill="#555555" text-anchor="middle">+ char[4096]:  4128</text>
<text x="206.0" y="418.5" font-size="11.5" fill="#555555" text-anchor="middle">heap, unless elided</text>
<rect x="396" y="314" width="330" height="134" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="561.0" y="356.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the frame holds ONLY:</text>
<text x="561.0" y="373.5" font-size="11.5" fill="#555555" text-anchor="middle">the promise, resume + destroy</text>
<text x="561.0" y="388.5" font-size="11.5" fill="#555555" text-anchor="middle">pointers, a state index, and</text>
<text x="561.0" y="403.5" font-size="11.5" fill="#555555" text-anchor="middle">the locals live across a suspend.</text>
<text x="561.0" y="418.5" font-size="11.5" fill="#555555" text-anchor="middle">Cost is what you carry.</text>
<rect x="766" y="314" width="340" height="134" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="936.0" y="364.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">suspends only at co_await</text>
<text x="936.0" y="381.0" font-size="11.5" fill="#555555" text-anchor="middle">cooperative: control returns</text>
<text x="936.0" y="396.0" font-size="11.5" fill="#555555" text-anchor="middle">to the caller — nothing</text>
<text x="936.0" y="411.0" font-size="11.5" fill="#555555" text-anchor="middle">is preempted, nothing blocked</text>
<rect x="286" y="470" width="590" height="48" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="581.0" y="499.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">262,144 coroutine frames fit in one thread&#x27;s stack</text>
<path d="M206,230 L206,314" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M581,448 L581,470" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="40" y="548" font-size="11" fill="#1d1d1d" text-anchor="start">Both hold one paused computation. Only one of them reserves 8 MiB of address space and a kernel task to do it — which is the whole reason coroutines exist.</text>
<text x="40" y="572" font-size="11" fill="#1d1d1d" text-anchor="start">Frame sizes are measured by overloading operator new inside promise_type: the only portable way to see a size the language deliberately hides.</text>
<text x="40" y="596" font-size="11" fill="#1d1d1d" text-anchor="start">Thread stack from ch50 (pthread_getattr_np); frame sizes from this chapter. GCC 16.1.1, C++23, Fedora 44. Nothing here is a duration.</text>
</svg>