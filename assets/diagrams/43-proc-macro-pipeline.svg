<text x="155.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">#[instrument]</text>
<text x="155.0" y="172.5" font-size="11.5" fill="#555555" text-anchor="middle">fn hash_chunk(len) -&gt; u64</text>
