<path d="M502,335 L558,335" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="536.0" y="329.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">AST</text>
<text x="536.0" y="329.0" font-size="11" fill="#555" text-anchor="middle">AST</text>
<path d="M655,288 L655,176" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="655.0" y="238.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">TokenStream (macro output)</text>
<text x="655.0" y="238.0" font-size="11" fill="#b8650a" text-anchor="middle">TokenStream (macro output)</text>
<path d="M752,130 L798,130" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="400" font-size="12" fill="#b8650a" text-anchor="start">sysmacros never runs at app runtime: it is pure tokens-in / tokens-out, executed only while rustc is compiling app.</text>
<text x="40" y="420" font-size="12" fill="#555555" text-anchor="start">Two crates, one build: cargo compiles sysmacros to a host-side compiler plugin before it ever compiles main.rs.</text>
