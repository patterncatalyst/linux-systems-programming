<text x="885.0" y="150.0" font-size="11.5" fill="#dddddd" text-anchor="middle">instrumented hash_chunk</text>
<text x="885.0" y="165.0" font-size="11.5" fill="#dddddd" text-anchor="middle">(tokens, now real code)</text>
