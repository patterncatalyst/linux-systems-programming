<text x="405.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rustc: macro invocation</text>
<text x="405.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">sees the attribute/derive</text>
<text x="405.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">packages a TokenStream</text>
<rect x="560" y="95" width="190" height="80" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="655.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">rustc: expand &amp; typecheck</text>
<text x="655.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">splices tokens into the AST</text>
<text x="655.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">typechecks the result</text>
