<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1096" height="196" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">Not parallel — one CPU occupied</text>
<rect x="24" y="266" width="1096" height="196" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="286" font-size="12" font-weight="700" fill="#1d1d1d">Parallel — many CPUs occupied</text>
<rect x="52" y="14" width="250" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="177.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">conc — one workload, four models</text>
<rect x="70" y="96" width="300" height="132" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">sequential</text>
<text x="220.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">1 task in flight, 1 CPU</text>
<text x="220.0" y="177.0" font-size="11.5" fill="#555555" text-anchor="middle">max_inflight=1  interleaves=0</text>
<text x="220.0" y="192.0" font-size="11.5" fill="#555555" text-anchor="middle">neither concurrent nor parallel</text>
<rect x="430" y="96" width="330" height="132" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="595.0" y="137.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">concurrent</text>
<text x="595.0" y="154.5" font-size="11.5" fill="#555555" text-anchor="middle">16 tasks in flight, pinned to CPU 0</text>
<text x="595.0" y="169.5" font-size="11.5" fill="#555555" text-anchor="middle">cpus_allowed=1  distinct_cpus=1</text>
<text x="595.0" y="184.5" font-size="11.5" fill="#555555" text-anchor="middle">max_inflight=16  interleaves=19</text>
<text x="595.0" y="199.5" font-size="11.5" fill="#555555" text-anchor="middle">CONCURRENT, NOT PARALLEL</text>
<rect x="810" y="96" width="280" height="132" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="950.0" y="145.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">sched_setaffinity(2)</text>
<text x="950.0" y="162.0" font-size="11.5" fill="#555555" text-anchor="middle">CPU_SET(0) → one CPU allowed</text>
<text x="950.0" y="177.0" font-size="11.5" fill="#555555" text-anchor="middle">parallelism removed by request,</text>
<text x="950.0" y="192.0" font-size="11.5" fill="#555555" text-anchor="middle">not by accident</text>
<rect x="70" y="308" width="300" height="132" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="220.0" y="357.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">parallel</text>
<text x="220.0" y="374.0" font-size="11.5" fill="#555555" text-anchor="middle">16 tasks, 16 CPUs, unpinned</text>
<text x="220.0" y="389.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_cpus=16  max_inflight=16</text>
<text x="220.0" y="404.0" font-size="11.5" fill="#555555" text-anchor="middle">one task per CPU</text>
<rect x="430" y="308" width="330" height="132" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="595.0" y="349.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">both</text>
<text x="595.0" y="366.5" font-size="11.5" fill="#555555" text-anchor="middle">32 tasks on 16 CPUs (oversubscribed)</text>
<text x="595.0" y="381.5" font-size="11.5" fill="#555555" text-anchor="middle">distinct_cpus=16  interleaves=7557</text>
<text x="595.0" y="396.5" font-size="11.5" fill="#555555" text-anchor="middle">max_inflight=25 &gt; cpus_allowed=16</text>
<text x="595.0" y="411.5" font-size="11.5" fill="#555555" text-anchor="middle">CONCURRENT AND PARALLEL</text>
<rect x="810" y="308" width="280" height="132" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="950.0" y="357.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">sched_getcpu() per sample</text>
<text x="950.0" y="374.0" font-size="11.5" fill="#555555" text-anchor="middle">unioned into a bitmap →</text>
<text x="950.0" y="389.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_cpus is an OUTCOME,</text>
<text x="950.0" y="404.0" font-size="11.5" fill="#555555" text-anchor="middle">cpus_allowed is a PERMISSION</text>
<rect x="330" y="488" width="490" height="54" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="575.0" y="513.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">all four → digest=0x481984990deee5ff, consensus=yes</text>
<text x="575.0" y="530.0" font-size="11.5" fill="#555555" text-anchor="middle">the answer does not depend on the execution model</text>
<path d="M220,228 L220,308" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M595,228 L595,308" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M220,440 L430,492" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M595,440 L595,488" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="40" y="566" font-size="11" fill="#1d1d1d" text-anchor="start">Concurrency is STRUCTURE (how many tasks are in flight); parallelism is EXECUTION (how many CPUs are occupied). They are independent axes, which is why all four cells exist.</text>
<text x="40" y="590" font-size="11" fill="#1d1d1d" text-anchor="start">Numbers are from real runs on the 16-CPU reference host. Nothing here is a duration — every observable is a count or a set cardinality (see ch39).</text>
</svg>