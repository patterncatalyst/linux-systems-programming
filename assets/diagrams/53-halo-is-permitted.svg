<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1112" height="180" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">What the standard says</text>
<rect x="24" y="252" width="1112" height="250" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="272" font-size="12" font-weight="700" fill="#1d1d1d">What the two compilers on this host actually do — 1000 calls each</text>
<rect x="390" y="14" width="380" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">HALO: permitted, required of nobody</text>
<rect x="56" y="96" width="480" height="118" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="296.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">[dcl.fct.def.coroutine]</text>
<text x="296.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">the implementation MAY elide the frame allocation</text>
<text x="296.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">when the frame provably does not outlive the caller</text>
<text x="296.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;may&quot; — there is no conforming way to depend on it</text>
<rect x="576" y="96" width="530" height="118" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="841.0" y="138.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the test case is the easiest one there is:</text>
<text x="841.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">suspend_never at both ends, runs to completion inside</text>
<text x="841.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">the call, frame provably dies there.</text>
<text x="841.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">If elision happens anywhere, it happens here.</text>
<rect x="56" y="294" width="500" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="306.0" y="334.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">g++ 16.1.1</text>
<text x="306.0" y="351.5" font-size="11.5" fill="#555555" text-anchor="middle">-O0: 1000   -O1: 1000   -O2: 1000   -O3: 1000</text>
<text x="306.0" y="366.5" font-size="11.5" fill="#555555" text-anchor="middle">elides NONE, at any level</text>
<rect x="596" y="294" width="510" height="100" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="851.0" y="334.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">clang++ 22.1.8</text>
<text x="851.0" y="351.5" font-size="11.5" fill="#555555" text-anchor="middle">-O0: 1000   -O1: 0   -O2: 0</text>
<text x="851.0" y="366.5" font-size="11.5" fill="#555555" text-anchor="middle">elides EVERY one from -O1 up</text>
<rect x="196" y="414" width="770" height="72" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="581.0" y="448.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Same source. Same standard. Same -O2. 1000 heap allocations, or none.</text>
<text x="581.0" y="465.0" font-size="11.5" fill="#555555" text-anchor="middle">&quot;the optimizer will remove it&quot; is a claim about your compiler, not about C++.</text>
<path d="M306,214 L306,294" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M841,214 L841,294" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="40" y="524" font-size="11" fill="#1d1d1d" text-anchor="start">Counted by overloading operator new on the promise type, so every frame allocation is observed rather than inferred from a profiler.</text>
<text x="40" y="548" font-size="11" fill="#1d1d1d" text-anchor="start">verify.lua does NOT gate on whether elision happens — that would encode one compiler&#x27;s choice as a rule. It gates that the count is measured, and compares the two.</text>
<text x="40" y="572" font-size="11" fill="#1d1d1d" text-anchor="start">If a future GCC starts eliding, the gate keeps passing and the chapter&#x27;s numbers change. That is the intended behaviour.</text>
</svg>