<text x="20" y="600" font-size="12" fill="#1d1d1d" text-anchor="start">Both gates are rust-native — cargo test and the deterministic report digest run inside the pinned toolchain, verified offline on this host.</text>
<text x="20" y="618" font-size="12" fill="#555555" text-anchor="start">FNV-1a is language-independent: the same 0x481984990deee5ff digest appears in the ch46 C++ and ch47 Go toolbox reports.</text>
