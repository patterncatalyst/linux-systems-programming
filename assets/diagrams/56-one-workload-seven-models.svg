<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 726" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="40" width="1112" height="96" rx="12" fill="#fbfbfb" stroke="#ddd"/>
<text x="36" y="60" font-size="12" font-weight="700" fill="#1d1d1d">ONE workload, shared verbatim by every model (workload.hpp)</text>
<rect x="24" y="156" width="1112" height="164" rx="12" fill="#f7faf7" stroke="#ddd"/>
<text x="36" y="176" font-size="12" font-weight="700" fill="#1d1d1d">one OS thread — concurrent, not parallel (ch49). No lock anywhere, because there is nothing to race with.</text>
<rect x="24" y="340" width="1112" height="176" rx="12" fill="#faf7f7" stroke="#ddd"/>
<text x="36" y="360" font-size="12" font-weight="700" fill="#1d1d1d">many OS threads + a LOCK — a thread that loses the race is parked, and has to be woken</text>
<rect x="24" y="536" width="1112" height="132" rx="12" fill="#fff8ef" stroke="#ddd"/>
<text x="36" y="556" font-size="12" font-weight="700" fill="#1d1d1d">many OS threads + a STRAND — the handler is deferred, so no thread ever blocks</text>
<rect x="180" y="70" width="800" height="54" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="95.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">8 tasks x 5000 rounds = 40000 folds into one accumulator</text>
<text x="580.0" y="112.0" font-size="11.5" fill="#dddddd" text-anchor="middle">every model below produced total = 0xb75768f6610642a0  (gate B, checked before any comparison is drawn)</text>
<rect x="45" y="196" width="330" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="210.0" y="229.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">sequential  (the control)</text>
<text x="210.0" y="246.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 1</text>
<text x="210.0" y="261.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 1</text>
<text x="210.0" y="276.0" font-size="11.5" fill="#555555" text-anchor="middle">8 tasks, one after another</text>
<rect x="415" y="196" width="330" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="580.0" y="229.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">coroutine  (ch53)</text>
<text x="580.0" y="246.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 1</text>
<text x="580.0" y="261.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 1</text>
<text x="580.0" y="276.0" font-size="11.5" fill="#555555" text-anchor="middle">8 in flight, 32-byte frames</text>
<rect x="785" y="196" width="330" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="950.0" y="229.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">fiber  (ch54)</text>
<text x="950.0" y="246.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 1</text>
<text x="950.0" y="261.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 1</text>
<text x="950.0" y="276.0" font-size="11.5" fill="#555555" text-anchor="middle">8 in flight, 128 KiB stacks</text>
<rect x="44" y="380" width="250" height="112" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="169.0" y="419.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">pthreads  (ch50)</text>
<text x="169.0" y="436.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 8</text>
<text x="169.0" y="451.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 230</text>
<text x="169.0" y="466.0" font-size="11.5" fill="#555555" text-anchor="middle">pthread_mutex_t</text>
<rect x="318" y="380" width="250" height="112" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="443.0" y="419.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">std::jthread  (ch51)</text>
<text x="443.0" y="436.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 8</text>
<text x="443.0" y="451.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 427</text>
<text x="443.0" y="466.0" font-size="11.5" fill="#555555" text-anchor="middle">std::mutex</text>
<rect x="592" y="380" width="250" height="112" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="717.0" y="419.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Boost.Thread  (ch52)</text>
<text x="717.0" y="436.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 8</text>
<text x="717.0" y="451.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 451</text>
<text x="717.0" y="466.0" font-size="11.5" fill="#555555" text-anchor="middle">boost::mutex + when_all</text>
<rect x="866" y="380" width="250" height="112" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="991.0" y="419.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">P2300 senders  (opt-in)</text>
<text x="991.0" y="436.0" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 8</text>
<text x="991.0" y="451.0" font-size="11.5" fill="#555555" text-anchor="middle">futex calls = 562</text>
<text x="991.0" y="466.0" font-size="11.5" fill="#555555" text-anchor="middle">NVIDIA stdexec, NOT the stdlib</text>
<rect x="330" y="568" width="500" height="88" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="580.0" y="602.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Boost.Asio strand  (ch55)</text>
<text x="580.0" y="619.5" font-size="11.5" fill="#555555" text-anchor="middle">distinct_tids = 8   ·   futex calls = 51</text>
<text x="580.0" y="634.5" font-size="11.5" fill="#555555" text-anchor="middle">same 8 threads as the row above, serialized without a lock</text>
<path d="M717,496 L717,566" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="717.0" y="523.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">1/8 the futex traffic of the row above</text>
<text x="717.0" y="523.0" font-size="11" fill="#b8650a" text-anchor="middle">1/8 the futex traffic of the row above</text>
<text x="24" y="692" font-size="11" fill="#1d1d1d" text-anchor="start">Instrument 1: gettid(), ch50&#x27;s. Instrument 2: strace -f -c -e trace=futex, ch51&#x27;s. Both applied identically to all seven models — which is the only thing that makes this a comparison rather than a table of quotations.</text>
<text x="24" y="710" font-size="11" fill="#555555" text-anchor="start">Futex magnitudes move on every run and are never gated; the three TIERS are. Measured on the Fedora 44 reference host, Boost 1.90.0, GCC 16.1.1.</text>
</svg>