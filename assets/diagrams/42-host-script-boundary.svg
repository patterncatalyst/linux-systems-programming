<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="300" height="560" rx="12" fill="#eef4fb" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">three host runtimes</text>
<rect x="360" y="120" width="340" height="360" rx="12" fill="#f4f4f4" stroke="#ddd"/>
<text x="372" y="140" font-size="12" font-weight="700" fill="#1d1d1d">sandbox boundary (enforced by the host, per language)</text>
<rect x="40" y="60" width="260" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="170.0" y="93.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">C++23 (sol2 3.5.0)</text>
<text x="170.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">open_libraries(base/string/table/math)</text>
<text x="170.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">sol::protected_function on_exit</text>
<text x="170.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">Lua 5.4.6 (PUC-Rio)</text>
<rect x="40" y="250" width="260" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="170.0" y="283.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Go (gopher-lua v1.1.2)</text>
<text x="170.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">OpenBase/String/Table/Math</text>
<text x="170.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">L.CallByParam{Protect:true}</text>
<text x="170.0" y="330.0" font-size="11.5" fill="#555555" text-anchor="middle">Lua 5.1 semantics</text>
<rect x="40" y="440" width="260" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="170.0" y="473.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Rust (mlua 0.12, lua54+vendored)</text>
<text x="170.0" y="490.0" font-size="11.5" fill="#555555" text-anchor="middle">StdLib::STRING|TABLE|MATH</text>
<text x="170.0" y="505.0" font-size="11.5" fill="#555555" text-anchor="middle">on_exit.call::&lt;Table&gt;(info)</text>
<text x="170.0" y="520.0" font-size="11.5" fill="#555555" text-anchor="middle">Lua 5.4 (PUC-Rio, vendored)</text>
<rect x="400" y="220" width="260" height="140" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="530.0" y="273.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">policy.lua (one file)</text>
<text x="530.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">on_exit(info) -&gt; decision</text>
<text x="530.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">on_load()  ·  POLICY_VERSION</text>
<text x="530.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">shared Lua 5.1/5.4 subset</text>
<rect x="400" y="400" width="260" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="530.0" y="428.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">blocked: os, io, package, debug</text>
<text x="530.0" y="445.0" font-size="11.5" fill="#555555" text-anchor="middle">nilled: load/loadfile/dofile/require/collectgarbage/loadstring</text>
<rect x="760" y="250" width="220" height="100" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="870.0" y="290.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">host table (bound in)</text>
<text x="870.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">host.log(msg) -&gt; stdout</text>
<text x="870.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">host.now_ms() -&gt; ms since epoch/steady clock</text>
<path d="M300,110 L400,260" fill="none" stroke="#555" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="360.0" y="130.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">on_exit(info)  /  decision{action,delay_ms,reason}</text>
<text x="360.0" y="130.0" font-size="11" fill="#555" text-anchor="middle">on_exit(info)  /  decision{action,delay_ms,reason}</text>
<path d="M300,300 L400,300" fill="none" stroke="#555" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="350.0" y="290.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">on_exit(info)  /  decision{...}</text>
<text x="350.0" y="290.0" font-size="11" fill="#555" text-anchor="middle">on_exit(info)  /  decision{...}</text>
<path d="M300,490 L400,340" fill="none" stroke="#555" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="360.0" y="460.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">on_exit(info)  /  decision{...}</text>
<text x="360.0" y="460.0" font-size="11" fill="#555" text-anchor="middle">on_exit(info)  /  decision{...}</text>
<path d="M660,290 L760,290" fill="none" stroke="#555" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="710.0" y="280.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">host.log / host.now_ms</text>
<text x="710.0" y="280.0" font-size="11" fill="#555" text-anchor="middle">host.log / host.now_ms</text>
<text x="30" y="45" font-size="12" fill="#2f6db5" text-anchor="start" font-weight="700">pmon (three ports, one behavior)</text>
<text x="530" y="500" font-size="11.5" fill="#1d1d1d" text-anchor="middle">Lua 5.1 (gopher-lua) vs Lua 5.4 (sol2, mlua) forces the</text>
<text x="530" y="516" font-size="11.5" fill="#1d1d1d" text-anchor="middle">shared subset: no //, no goto, no &lt;close&gt;, no bitwise ops,</text>
<text x="530" y="532" font-size="11.5" fill="#1d1d1d" text-anchor="middle">no 5.2+-only stdlib -- one policy.lua drives all three.</text>
<text x="870" y="380" font-size="11" fill="#555555" text-anchor="middle">every (re)load builds a fresh</text>
<text x="870" y="396" font-size="11" fill="#555555" text-anchor="middle">sandboxed state from scratch</text>
</svg>