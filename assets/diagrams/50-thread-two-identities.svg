<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1112" height="214" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">C++ view — portable, and deliberately narrow</text>
<rect x="24" y="286" width="1112" height="250" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="306" font-size="12" font-weight="700" fill="#1d1d1d">Linux view — the same thread, as the kernel and glibc see it</text>
<rect x="430" y="14" width="300" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">one thread, two identities</text>
<rect x="60" y="96" width="300" height="140" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="141.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">std::thread</text>
<text x="210.0" y="158.5" font-size="11.5" fill="#555555" text-anchor="middle">id: std::thread::id (opaque)</text>
<text x="210.0" y="173.5" font-size="11.5" fill="#555555" text-anchor="middle">join / detach / joinable</text>
<text x="210.0" y="188.5" font-size="11.5" fill="#555555" text-anchor="middle">hardware_concurrency()</text>
<text x="210.0" y="203.5" font-size="11.5" fill="#555555" text-anchor="middle">no name, no stack, no affinity</text>
<rect x="430" y="96" width="300" height="140" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="580.0" y="141.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">native_handle()</text>
<text x="580.0" y="158.5" font-size="11.5" fill="#555555" text-anchor="middle">the sanctioned escape hatch</text>
<text x="580.0" y="173.5" font-size="11.5" fill="#555555" text-anchor="middle">native_handle_type</text>
<text x="580.0" y="188.5" font-size="11.5" fill="#555555" text-anchor="middle">IS pthread_t here</text>
<text x="580.0" y="203.5" font-size="11.5" fill="#555555" text-anchor="middle">(static_assert, compile time)</text>
<rect x="800" y="96" width="300" height="140" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="950.0" y="141.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">std::jthread + stop_token</text>
<text x="950.0" y="158.5" font-size="11.5" fill="#555555" text-anchor="middle">cooperative cancellation:</text>
<text x="950.0" y="173.5" font-size="11.5" fill="#555555" text-anchor="middle">a flag the target checks</text>
<text x="950.0" y="188.5" font-size="11.5" fill="#555555" text-anchor="middle">no unwinding, no exception</text>
<text x="950.0" y="203.5" font-size="11.5" fill="#555555" text-anchor="middle">the answer to pthread_cancel</text>
<rect x="60" y="330" width="250" height="126" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="185.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">pthread_t</text>
<text x="185.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">an opaque glibc handle</text>
<text x="185.0" y="408.0" font-size="11.5" fill="#555555" text-anchor="middle">compare with pthread_equal</text>
<text x="185.0" y="423.0" font-size="11.5" fill="#555555" text-anchor="middle">NOT a number, not a tid</text>
<rect x="345" y="330" width="250" height="126" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="470.0" y="376.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">gettid() — the kernel tid</text>
<text x="470.0" y="393.0" font-size="11.5" fill="#555555" text-anchor="middle">a real integer; names a dir</text>
<text x="470.0" y="408.0" font-size="11.5" fill="#555555" text-anchor="middle">/proc/self/task/&lt;tid&gt;/</text>
<text x="470.0" y="423.0" font-size="11.5" fill="#555555" text-anchor="middle">main thread: tid == pid</text>
<rect x="630" y="330" width="470" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="865.0" y="358.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">naming — pthread_setname_np</text>
<text x="865.0" y="375.0" font-size="11.5" fill="#555555" text-anchor="middle">→ /proc/self/task/&lt;tid&gt;/comm · 15 max, 16 → ERANGE</text>
<rect x="630" y="402" width="470" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="865.0" y="430.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">stack — pthread_attr_setstacksize</text>
<text x="865.0" y="447.0" font-size="11.5" fill="#555555" text-anchor="middle">→ 262144 · below PTHREAD_STACK_MIN=16384 → EINVAL</text>
<rect x="630" y="474" width="470" height="42" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="865.0" y="500.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">affinity — one THREAD · sched — SCHED_OTHER/0, FIFO → EPERM</text>
<rect x="60" y="474" width="535" height="42" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="327.5" y="500.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">every facet still reports digest=0x481984990deee5ff</text>
<path d="M360,166 L430,166" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M560,236 L470,330" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M730,166 L800,166" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="566" font-size="11" fill="#1d1d1d" text-anchor="start">std::thread wraps a pthread and exposes almost none of it. Everything in the lower band is reachable, but only through native_handle() — which is why the standard put it there.</text>
<text x="40" y="590" font-size="11" fill="#1d1d1d" text-anchor="start">pthread_t and gettid() are not two spellings of one id: one is a glibc handle you may only compare, the other is the kernel&#x27;s task id that /proc, perf, and gdb all speak.</text>
<text x="40" y="614" font-size="11" fill="#1d1d1d" text-anchor="start">Every value shown is from a real run on the 16-CPU reference host (glibc 2.43). Nothing here is a duration; see ch39.</text>
</svg>