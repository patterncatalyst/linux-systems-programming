<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 524" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1096" height="222" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">Live on this toolchain — GCC 16.1.1, hard-gated, verified offline</text>
<rect x="24" y="292" width="1096" height="180" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="312" font-size="12" font-weight="700" fill="#1d1d1d">Not implemented here — forward-looking prose, no gate, no committed dead code</text>
<rect x="52" y="14" width="310" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="207.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">C++26 in ch49 — measured, not assumed</text>
<rect x="64" y="96" width="340" height="160" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="234.0" y="136.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Contracts — P2900</text>
<text x="234.0" y="153.5" font-size="11.5" fill="#555555" text-anchor="middle">-fcontracts, __cpp_contracts=202502</text>
<text x="234.0" y="168.5" font-size="11.5" fill="#555555" text-anchor="middle">one source → four binaries:</text>
<text x="234.0" y="183.5" font-size="11.5" fill="#555555" text-anchor="middle">ignore (silent) / observe (reports, runs on)</text>
<text x="234.0" y="198.5" font-size="11.5" fill="#555555" text-anchor="middle">enforce (reports, aborts)</text>
<text x="234.0" y="213.5" font-size="11.5" fill="#555555" text-anchor="middle">quick_enforce (aborts, no diagnostic)</text>
<text x="234.0" y="228.5" font-size="11.5" fill="#555555" text-anchor="middle">four behaviors, not four exit codes</text>
<rect x="432" y="96" width="340" height="160" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="602.0" y="136.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Safety hardening</text>
<text x="602.0" y="153.5" font-size="11.5" fill="#555555" text-anchor="middle">_GLIBCXX_ASSERTIONS on Fedora 44:</text>
<text x="602.0" y="168.5" font-size="11.5" fill="#555555" text-anchor="middle">default ON at -O0, OFF at -O2</text>
<text x="602.0" y="183.5" font-size="11.5" fill="#555555" text-anchor="middle">hardened build traps, names</text>
<text x="602.0" y="198.5" font-size="11.5" fill="#555555" text-anchor="middle">__n &lt; this-&gt;size()</text>
<text x="602.0" y="213.5" font-size="11.5" fill="#555555" text-anchor="middle">unchecked build asserted STATICALLY</text>
<text x="602.0" y="228.5" font-size="11.5" fill="#555555" text-anchor="middle">(no __glibcxx_assert_fail symbol)</text>
<rect x="800" y="96" width="290" height="160" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="945.0" y="144.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">why static for the unchecked side</text>
<text x="945.0" y="161.0" font-size="11.5" fill="#555555" text-anchor="middle">the out-of-bounds read is UB;</text>
<text x="945.0" y="176.0" font-size="11.5" fill="#555555" text-anchor="middle">gating on what UB prints would</text>
<text x="945.0" y="191.0" font-size="11.5" fill="#555555" text-anchor="middle">be unsound, so the gate checks</text>
<text x="945.0" y="206.0" font-size="11.5" fill="#555555" text-anchor="middle">that the check is absent from</text>
<text x="945.0" y="221.0" font-size="11.5" fill="#555555" text-anchor="middle">the binary instead</text>
<rect x="64" y="326" width="340" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="234.0" y="354.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">std::execution senders — P2300</text>
<text x="234.0" y="371.0" font-size="11.5" fill="#555555" text-anchor="middle">__cpp_lib_senders = undefined</text>
<text x="234.0" y="386.0" font-size="11.5" fill="#555555" text-anchor="middle">GCC 16&#x27;s &lt;execution&gt; is the C++17</text>
<text x="234.0" y="401.0" font-size="11.5" fill="#555555" text-anchor="middle">parallel-algorithms header</text>
<text x="234.0" y="416.0" font-size="11.5" fill="#555555" text-anchor="middle">(__cpp_lib_execution = 201902)</text>
<text x="234.0" y="431.0" font-size="11.5" fill="#555555" text-anchor="middle">live comparison deferred to ch56</text>
<rect x="432" y="326" width="340" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="602.0" y="354.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Static reflection — P2996</text>
<text x="602.0" y="371.0" font-size="11.5" fill="#555555" text-anchor="middle">__cpp_impl_reflection = undefined</text>
<text x="602.0" y="386.0" font-size="11.5" fill="#555555" text-anchor="middle">GCC 16: no ^^T operator</text>
<text x="602.0" y="401.0" font-size="11.5" fill="#555555" text-anchor="middle">clang 22: -freflection rejected</text>
<text x="602.0" y="416.0" font-size="11.5" fill="#555555" text-anchor="middle">as an unknown argument</text>
<text x="602.0" y="431.0" font-size="11.5" fill="#555555" text-anchor="middle">shape shown, nothing executed</text>
<rect x="800" y="326" width="290" height="120" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="945.0" y="361.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">the rule for both lanes</text>
<text x="945.0" y="378.5" font-size="11.5" fill="#555555" text-anchor="middle">support status is MEASURED on</text>
<text x="945.0" y="393.5" font-size="11.5" fill="#555555" text-anchor="middle">this host and stated in the</text>
<text x="945.0" y="408.5" font-size="11.5" fill="#555555" text-anchor="middle">footer — never inferred from</text>
<text x="945.0" y="423.5" font-size="11.5" fill="#555555" text-anchor="middle">a standard&#x27;s publication date</text>
<path d="M234,256 L234,326" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M602,256 L602,326" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="40" y="492" font-size="11" fill="#1d1d1d" text-anchor="start">Two of the C++26 &#x27;Fab Four&#x27; run for real here and two do not. Both facts are measured on the reference host, and the chapter marks each section accordingly.</text>
</svg>