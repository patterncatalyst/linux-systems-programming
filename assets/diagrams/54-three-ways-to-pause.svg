<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1112" height="136" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">Kernel-scheduled — the kernel knows about it</text>
<rect x="24" y="208" width="1112" height="150" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="228" font-size="12" font-weight="700" fill="#1d1d1d">User-scheduled, stackful — a real machine stack, switched by boost::context</text>
<rect x="24" y="376" width="1112" height="136" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="396" font-size="12" font-weight="700" fill="#1d1d1d">User-scheduled, stackless — no stack at all</text>
<rect x="400" y="14" width="360" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">one paused computation, three prices</text>
<rect x="56" y="90" width="300" height="86" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="206.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">thread — ch50</text>
<text x="206.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">8388608 bytes of stack</text>
<rect x="396" y="90" width="710" height="86" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="751.0" y="131.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">preempted anywhere · a tid in /proc · a kernel task_struct</text>
<text x="751.0" y="148.0" font-size="11.5" fill="#555555" text-anchor="middle">suspends wherever the scheduler decides, with no cooperation needed</text>
<rect x="56" y="244" width="300" height="98" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="206.0" y="283.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">fiber — ch54</text>
<text x="206.0" y="300.5" font-size="11.5" fill="#555555" text-anchor="middle">131072 bytes (128 KiB)</text>
<text x="206.0" y="315.5" font-size="11.5" fill="#555555" text-anchor="middle">64 fit in one thread stack</text>
<rect x="396" y="244" width="710" height="98" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="751.0" y="283.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">suspends from ANYWHERE in an ordinary call tree — measured at 6 frames deep</text>
<text x="751.0" y="300.5" font-size="11.5" fill="#555555" text-anchor="middle">no co_await, no coroutine, no function colouring.</text>
<text x="751.0" y="315.5" font-size="11.5" fill="#555555" text-anchor="middle">The stack is exactly what buys that.</text>
<rect x="56" y="412" width="300" height="86" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="206.0" y="445.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">coroutine frame — ch53</text>
<text x="206.0" y="462.5" font-size="11.5" fill="#555555" text-anchor="middle">32 bytes</text>
<text x="206.0" y="477.5" font-size="11.5" fill="#555555" text-anchor="middle">4096 fit in one fiber stack</text>
<rect x="396" y="412" width="710" height="86" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="751.0" y="453.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">suspends ONLY at co_await, only in a coroutine body —</text>
<text x="751.0" y="470.0" font-size="11.5" fill="#555555" text-anchor="middle">every frame in the suspend path must itself be a coroutine</text>
<rect x="286" y="536" width="590" height="48" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="581.0" y="565.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">8 MiB → 128 KiB → 32 bytes, each number measured on this host</text>
<path d="M206,176 L206,244" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="212.0" y="204.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">÷64</text>
<text x="212.0" y="204.0" font-size="11" fill="#b8650a" text-anchor="middle">÷64</text>
<path d="M206,342 L206,412" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="212.0" y="371.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">÷4096</text>
<text x="212.0" y="371.0" font-size="11" fill="#555" text-anchor="middle">÷4096</text>
<text x="40" y="610" font-size="11" fill="#1d1d1d" text-anchor="start">Cost and capability move together, and in opposite directions: the more a paused computation costs, the fewer restrictions there are on where it may pause.</text>
<text x="40" y="634" font-size="11" fill="#1d1d1d" text-anchor="start">Thread stack from ch50 (pthread_getattr_np); frame from ch53 (operator new in promise_type); fiber from stack_traits::default_size(). Boost 1.90.0, Fedora 44.</text>
</svg>