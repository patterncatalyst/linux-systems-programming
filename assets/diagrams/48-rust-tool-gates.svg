<text x="220" y="565" font-size="12" fill="#1d1d1d" text-anchor="start">Hard lane needs only the pinned toolchain — rustfmt and clippy ship as rust-toolchain.toml components, so all five gates run offline with no cargo install.</text>
<text x="220" y="581" font-size="12" fill="#555555" text-anchor="start">Gated lane needs `cargo install &lt;tool&gt;` (cargo-audit also needs the advisory-db over network) — not run on this host; watch/flamegraph/sccache are accelerators shown, not gated.</text>
