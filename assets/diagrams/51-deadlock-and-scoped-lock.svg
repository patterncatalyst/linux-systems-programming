<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="54" width="1112" height="250" rx="12" fill="#fdf7ef" stroke="#ddd"/>
<text x="36" y="74" font-size="12" font-weight="700" fill="#1d1d1d">std::lock_guard in opposing orders — the textbook deadlock</text>
<rect x="24" y="322" width="1112" height="190" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="36" y="342" font-size="12" font-weight="700" fill="#1d1d1d">std::scoped_lock — takes them all at once, so order stops mattering</text>
<rect x="410" y="14" width="340" height="30" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="580.0" y="34.5" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">two mutexes, two threads, two outcomes</text>
<rect x="56" y="96" width="270" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="191.0" y="141.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">thread 1</text>
<text x="191.0" y="158.5" font-size="11.5" fill="#555555" text-anchor="middle">lock_guard x(a);</text>
<text x="191.0" y="173.5" font-size="11.5" fill="#555555" text-anchor="middle">lock_guard y(b);</text>
<rect x="366" y="96" width="270" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="501.0" y="134.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">thread 2</text>
<text x="501.0" y="151.0" font-size="11.5" fill="#555555" text-anchor="middle">lock_guard x(b);</text>
<text x="501.0" y="166.0" font-size="11.5" fill="#555555" text-anchor="middle">lock_guard y(a);</text>
<text x="501.0" y="181.0" font-size="11.5" fill="#555555" text-anchor="middle">the opposite order</text>
<rect x="676" y="96" width="430" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="891.0" y="141.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">each holds what the other needs</text>
<text x="891.0" y="158.5" font-size="11.5" fill="#555555" text-anchor="middle">timeout(1) exit 124 — it never returns</text>
<text x="891.0" y="173.5" font-size="11.5" fill="#555555" text-anchor="middle">no error, no exception, no diagnostic</text>
<rect x="366" y="226" width="740" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="736.0" y="254.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">and the kernel names it: /proc/&lt;pid&gt;/task/*/wchan</text>
<text x="736.0" y="271.0" font-size="11.5" fill="#555555" text-anchor="middle">tid 2744896 · 2744897 · 2744898 → all three read futex_do_wait</text>
<rect x="56" y="362" width="270" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="191.0" y="415.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">thread 1</text>
<text x="191.0" y="432.0" font-size="11.5" fill="#555555" text-anchor="middle">scoped_lock lock(a, b);</text>
<rect x="366" y="362" width="270" height="110" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="501.0" y="407.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">thread 2</text>
<text x="501.0" y="424.5" font-size="11.5" fill="#555555" text-anchor="middle">scoped_lock lock(b, a);</text>
<text x="501.0" y="439.5" font-size="11.5" fill="#555555" text-anchor="middle">still the opposite order</text>
<rect x="676" y="362" width="430" height="110" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="891.0" y="407.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">try-all, back off, retry — not argument order</text>
<text x="891.0" y="424.5" font-size="11.5" fill="#555555" text-anchor="middle">100,000 acquisitions completed, exit 0</text>
<text x="891.0" y="439.5" font-size="11.5" fill="#555555" text-anchor="middle">the property lock_guard cannot give you</text>
<path d="M326,151 L366,151" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M636,151 L676,151" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M891,206 L891,226" fill="none" stroke="#b8650a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#am)"/>
<path d="M326,417 L366,417" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M636,417 L676,417" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="40" y="544" font-size="11" fill="#1d1d1d" text-anchor="start">Both rows are real runs on this host. The deadlock is reproduced under timeout(1) and hard-gated, including the wchan reading — the abstraction&#x27;s failure mode, named by the kernel.</text>
<text x="40" y="568" font-size="11" fill="#1d1d1d" text-anchor="start">Three threads park, not two: the two workers plus main, blocked in join(). All of them end up in the same kernel function.</text>
<text x="40" y="592" font-size="11" fill="#1d1d1d" text-anchor="start">scoped_lock is not lock_guard with more arguments. It runs a deadlock-avoidance algorithm, which is why opposing orders are safe.</text>
</svg>