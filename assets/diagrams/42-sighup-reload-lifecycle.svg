<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="20" y="20" width="1160" height="460" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">one pmon process -- PID never changes</text>
<rect x="40" y="90" width="160" height="90" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="120.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">load v1</text>
<text x="120.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">policy.lua v1.0.0</text>
<text x="120.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">base=500ms max_restarts=8</text>
<rect x="230" y="90" width="160" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="310.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">phase-1 decisions</text>
<text x="310.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">web: stop</text>
<text x="310.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">worker: restart 500ms -&gt; 1000ms</text>
<rect x="420" y="90" width="160" height="90" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">awaiting SIGHUP</text>
<text x="500.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">pmon: awaiting SIGHUP</text>
<text x="500.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">to reload policy</text>
<rect x="610" y="90" width="160" height="90" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="690.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">reload</text>
<text x="690.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">fresh Lua state rebuilt</text>
<text x="690.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">on_load(): v1.1.0 logged</text>
<rect x="800" y="90" width="160" height="90" rx="9" fill="#ffffff" stroke="#111111" stroke-width="2"/>
<text x="880.0" y="125.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">phase-2 decisions</text>
<text x="880.0" y="142.5" font-size="11.5" fill="#555555" text-anchor="middle">api: restart 100ms</text>
<text x="880.0" y="157.5" font-size="11.5" fill="#555555" text-anchor="middle">worker: escalate (2 restarts)</text>
<rect x="990" y="90" width="160" height="90" rx="9" fill="#111111" stroke="#111111" stroke-width="2"/>
<text x="1070.0" y="133.0" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">exit 0</text>
<text x="1070.0" y="150.0" font-size="11.5" fill="#dddddd" text-anchor="middle">same PID throughout</text>
<rect x="430" y="20" width="260" height="50" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="43.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">[host]$ operator edits policy path,</text>
<text x="560.0" y="60.0" font-size="11.5" fill="#555555" text-anchor="middle">then: kill -HUP $(pgrep app)</text>
<rect x="250" y="260" width="170" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="335.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">C++: signalfd + poll</text>
<text x="335.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">(sigprocmask-blocked SIGHUP)</text>
<rect x="430" y="260" width="170" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="515.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Go: signal.Notify(ch)</text>
<text x="515.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">&lt;-ch on runtime sig thread</text>
<rect x="610" y="260" width="170" height="60" rx="9" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="695.0" y="288.0" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">Rust: signal_hook flag</text>
<text x="695.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">AtomicBool + 20ms poll</text>
<path d="M200,135 L230,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M390,135 L420,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M580,135 L610,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="595.0" y="125.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">real SIGHUP consumed</text>
<text x="595.0" y="125.0" font-size="11" fill="#555" text-anchor="middle">real SIGHUP consumed</text>
<path d="M770,135 L800,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M960,135 L990,135" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M560,70 L500,90" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M500,180 L500,260" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="560.0" y="230.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">each waits for the same</text>
<text x="560.0" y="230.0" font-size="11" fill="#555" text-anchor="middle">each waits for the same</text>
<text x="500" y="490" font-size="12" fill="#1d1d1d" text-anchor="middle" font-weight="700">The process is NOT restarted -- pmon keeps its PID and child-tracking state;</text>
<text x="500" y="506" font-size="11.5" fill="#1d1d1d" text-anchor="middle">only a fresh, sandboxed Lua state is built in place and the decision logic changes underneath it.</text>
</svg>