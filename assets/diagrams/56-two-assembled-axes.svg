<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 636" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8650a"/></marker></defs>
<rect x="24" y="40" width="540" height="506" rx="12" fill="#fbfbfb" stroke="#ddd"/>
<text x="36" y="60" font-size="12" font-weight="700" fill="#1d1d1d">what a paused computation costs</text>
<rect x="596" y="40" width="540" height="506" rx="12" fill="#fbfbfb" stroke="#ddd"/>
<text x="608" y="60" font-size="12" font-weight="700" fill="#1d1d1d">how cancellation arrives</text>
<rect x="64" y="96" width="460" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="294.0" y="132.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">thread — 8388608 bytes</text>
<text x="294.0" y="149.5" font-size="11.5" fill="#555555" text-anchor="middle">ch50, pthread_getattr_np</text>
<text x="294.0" y="164.5" font-size="11.5" fill="#555555" text-anchor="middle">the kernel schedules it, so it costs kernel state</text>
<rect x="64" y="246" width="460" height="92" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="294.0" y="282.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">fiber — 131072 bytes</text>
<text x="294.0" y="299.5" font-size="11.5" fill="#555555" text-anchor="middle">ch54, stack_traits::default_size()</text>
<text x="294.0" y="314.5" font-size="11.5" fill="#555555" text-anchor="middle">user-scheduled, but it keeps a real stack</text>
<rect x="64" y="396" width="460" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="294.0" y="432.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">coroutine frame — 32 bytes</text>
<text x="294.0" y="449.5" font-size="11.5" fill="#555555" text-anchor="middle">ch53, operator new in promise_type</text>
<text x="294.0" y="464.5" font-size="11.5" fill="#555555" text-anchor="middle">no stack: only what crosses a suspension</text>
<rect x="636" y="96" width="460" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="866.0" y="132.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ch50  pthread_cancel</text>
<text x="866.0" y="149.5" font-size="11.5" fill="#555555" text-anchor="middle">a FORCED UNWIND</text>
<text x="866.0" y="164.5" font-size="11.5" fill="#555555" text-anchor="middle">swallow it without rethrowing and the process aborts</text>
<rect x="636" y="206" width="460" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="866.0" y="242.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ch51  std::stop_token</text>
<text x="866.0" y="259.5" font-size="11.5" fill="#555555" text-anchor="middle">a FLAG the target polls</text>
<text x="866.0" y="274.5" font-size="11.5" fill="#555555" text-anchor="middle">nothing is thrown; there is nothing to swallow</text>
<rect x="636" y="316" width="460" height="92" rx="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="866.0" y="352.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ch52  thread::interrupt()</text>
<text x="866.0" y="369.5" font-size="11.5" fill="#555555" text-anchor="middle">an ORDINARY EXCEPTION</text>
<text x="866.0" y="384.5" font-size="11.5" fill="#555555" text-anchor="middle">thrown at defined interruption points</text>
<rect x="636" y="426" width="460" height="92" rx="9" fill="#fff8ef" stroke="#e8870c" stroke-width="2"/>
<text x="866.0" y="462.5" font-size="13.5" font-weight="700" fill="#111111" text-anchor="middle">ch55  cancellation_signal</text>
<text x="866.0" y="479.5" font-size="11.5" fill="#555555" text-anchor="middle">a COMPLETION carrying operation_aborted</text>
<text x="866.0" y="494.5" font-size="11.5" fill="#555555" text-anchor="middle">the handler still runs exactly once, so ownership never changes</text>
<path d="M294,188 L294,244" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="294.0" y="212.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">divide by 64</text>
<text x="294.0" y="212.0" font-size="11" fill="#b8650a" text-anchor="middle">divide by 64</text>
<path d="M294,338 L294,394" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="294.0" y="362.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">divide by 4096</text>
<text x="294.0" y="362.0" font-size="11" fill="#b8650a" text-anchor="middle">divide by 4096</text>
<text x="24" y="578" font-size="11" fill="#1d1d1d" text-anchor="start">NEITHER band is measured in ch56. Both are assembled from earlier chapters&#x27; own measurements, carried into the table arm as named constants beside the instrument that produced them — the pattern ch54 established.</text>
<text x="24" y="596" font-size="11" fill="#555555" text-anchor="start">Cost and capability move together and in opposite directions: the more a paused computation costs, the fewer restrictions there are on where it may pause.</text>
<text x="24" y="614" font-size="11" fill="#555555" text-anchor="start">P2300 senders are absent from both bands on purpose: __cpp_lib_senders is still undefined here, so ch56&#x27;s seventh arm links NVIDIA&#x27;s reference implementation, not the standard library.</text>
</svg>